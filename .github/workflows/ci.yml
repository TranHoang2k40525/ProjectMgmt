name: CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore ProjectMgmt.slnx

      - name: Build backend
        run: dotnet build ProjectMgmt.slnx --configuration Release --no-restore

      - name: Test backend
        run: dotnet test ProjectMgmt.Tests/ProjectMgmt.Tests.csproj --configuration Release --no-build

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/projectmgmt-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/projectmgmt-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build

  container-ci:
    name: container-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Validate TEST Compose configuration
        env:
          PROJECTMGMT_TEST_CONFIG_PATH: ./ProjectMgmt.Solution/appsettings.Staging.example.json
        run: docker compose -f docker-compose.test.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ProjectMgmt.Solution/Dockerfile
          push: false
          tags: projectmgmt-api:ci
          cache-from: type=gha,scope=projectmgmt-api
          cache-to: type=gha,mode=max,scope=projectmgmt-api

      - name: Build web container
        uses: docker/build-push-action@v6
        with:
          context: frontend/projectmgmt-web
          file: frontend/projectmgmt-web/Dockerfile
          push: false
          tags: projectmgmt-web:ci
          cache-from: type=gha,scope=projectmgmt-web
          cache-to: type=gha,mode=max,scope=projectmgmt-web
