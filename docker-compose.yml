name: projectmgmt-local

services:
  mysql:
    image: mysql:8.4
    command:
      - --lower-case-table-names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-allowed-packet=64M
    environment:
      MYSQL_DATABASE: projectmgmt
      MYSQL_USER: ${MYSQL_USER:?Copy .env.example to .env and set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env and set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - projectmgmt_mysql_data:/var/lib/mysql
      - ./docs/projectmgmt_schema_mysql_optimized.sql:/docker-entrypoint-initdb.d/001-projectmgmt-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

  api:
    image: projectmgmt-api:local
    build:
      context: .
      dockerfile: ProjectMgmt.Solution/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__ProjectMgmt: Server=mysql;Port=3306;Database=projectmgmt;User=${MYSQL_USER};Password=${MYSQL_PASSWORD};SslMode=None;
      Database__ServerVersion: 8.4.0
    ports:
      - "${API_PORT:-5083}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/health/live
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - frontend
    restart: unless-stopped

  web:
    image: projectmgmt-web:local
    build:
      context: ./frontend/projectmgmt-web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-4200}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - frontend
    restart: unless-stopped

networks:
  backend:
    internal: true
  frontend:

volumes:
  projectmgmt_mysql_data:
