<div
  #sceneHost
  class="neo-campus-scene"
  [class.neo-campus-scene--ready]="ready()"
  [class.neo-campus-scene--fallback]="fallback()"
  [attr.data-variant]="variant"
  aria-hidden="true"
>
  <canvas #sceneCanvas class="neo-campus-scene__canvas"></canvas>

  <div class="neo-campus-scene__fallback-art">
    <div class="fallback-orbit fallback-orbit--outer"></div>
    <div class="fallback-orbit fallback-orbit--inner"></div>
    <div class="fallback-campus">
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="fallback-robot">
      <span class="fallback-robot__eye"></span>
      <span class="fallback-robot__eye"></span>
    </div>
  </div>

  <div class="neo-campus-scene__veil"></div>
  <div class="neo-campus-scene__status">
    <span class="neo-campus-scene__pulse"></span>
    <strong>HUCE NEO CAMPUS</strong>
    <span>{{ label() }}</span>
  </div>
</div>
